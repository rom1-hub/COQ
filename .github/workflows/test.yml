name: COQ project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run tests
        run: pytest
      - name: Compile backend
        run: python -m compileall -q backend/app

  static-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required project files
        run: |
          test -f frontend/conjugacion.html
          test ! -f frontend/index.html
          test -f frontend/app.js
          test -f docs/QUESTIONNAIRE-LINGUISTIQUE.md
          test -f docs/CONTRATS-LINGUISTIQUES.md
          grep -q 'value="participe_present"' frontend/conjugacion.html
          grep -q 'value="gerondif_present"' frontend/conjugacion.html
          test -f backend/app/main.py
          node --check frontend/app.js
          ! grep -R "Educative-Web-Autoaprendizaje" backend frontend data || (echo "Unexpected reference from runtime project folders" && exit 1)
